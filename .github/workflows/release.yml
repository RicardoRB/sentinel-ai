name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to release." >&2
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify tag matches Maven version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pom_version="$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "$tag_version" != "$pom_version" ]]; then
            echo "Tag version ($tag_version) does not match pom.xml version ($pom_version)." >&2
            exit 1
          fi

  # Every check (quality gates, coverage, native tests, terminal smoke test, and harness suites)
  # passes before any release asset is built.
  verify:
    needs: preflight
    uses: ./.github/workflows/verify.yml
    with:
      native-runners: '["ubuntu-24.04", "macos-15-intel", "macos-14"]'
      harness-compatibility: true

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            binary: target/sentinel
          - os: macos-15-intel
            platform: macos-x86_64
            binary: target/sentinel
          - os: macos-14
            platform: macos-aarch64
            binary: target/sentinel
          - os: windows-latest
            platform: windows-x86_64
            binary: target/sentinel.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native executable
        run: ./mvnw -q -Pnative -DskipTests native:compile

      - name: Prepare Unix release asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="sentinel-${{ matrix.platform }}.tar.gz"
          mkdir package
          cp "${{ matrix.binary }}" LICENSE NOTICE package/
          chmod +x package/sentinel
          COPYFILE_DISABLE=1 tar -C package -czf "$archive" sentinel LICENSE NOTICE
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Prepare Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "sentinel-${{ matrix.platform }}.zip"
          New-Item -ItemType Directory package | Out-Null
          Copy-Item "${{ matrix.binary }}", LICENSE, NOTICE package
          Compress-Archive -Path "package/*" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii

      - name: Upload platform assets
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-${{ matrix.platform }}
          path: |
            sentinel-${{ matrix.platform }}.tar.gz
            sentinel-${{ matrix.platform }}.zip
            sentinel-${{ matrix.platform }}.*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            LICENSE
            NOTICE
          sparse-checkout-cone-mode: false

      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: sentinel-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release-assets/* LICENSE NOTICE \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
