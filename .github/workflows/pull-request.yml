name: Pull request

# Every pull request must pass the JVM quality gates (including the JaCoCo coverage threshold),
# build the native executable, and pass the native checks. JVM tests cannot see native-image-only
# failures (for example, classes defined at run time), so the native job runs the terminal tests
# inside a native test image and drives the built executable's raw-key init wizard through a
# pseudo-terminal.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ArchUnit, tests, Spotless, Checkstyle, PMD, SpotBugs, and >= 80% JaCoCo instruction coverage.
      - name: Run quality verification
        run: ./verify-quality.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  native:
    name: Native build and tests (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Build native executable
        run: ./mvnw -B -q -Pnative -DskipTests package native:compile

      - name: Run terminal tests in a native test image
        run: >-
          ./mvnw -B -Pnative
          -Dtest='dev/sentinel/infrastructure/terminal/**/*Test'
          -Dsurefire.failIfNoSpecifiedTests=false
          test native:test

      - name: Drive init through a pseudo-terminal
        run: >-
          ./mvnw -B
          -Dtest=NativeInitTerminalSmokeTest
          -Dsentinel.native.binary=target/sentinel
          test
