name: Verify

# Shared by pull requests and releases. JVM tests cannot see native-image-only failures (for
# example, classes defined at run time), so after the JVM quality gates pass, each runner runs the
# terminal tests inside a native test image, builds the native executable, and drives its raw-key
# init wizard through a pseudo-terminal (POSIX) or smoke-runs it (Windows).
on:
  workflow_call:
    inputs:
      native-runners:
        description: JSON array of runners for the native checks.
        type: string
        default: '["ubuntu-24.04", "macos-14", "windows-latest"]'
      harness-compatibility:
        description: Also run the deterministic agent-harness suites against the native executable.
        type: boolean
        default: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  TRIVY_VERSION: 0.76.0
  SEMGREP_VERSION: 1.181.0
  OPENSPEC_VERSION: 1.14.1

jobs:
  quality:
    name: Ward ci profile
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      # Full history for gitleaks.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install gate tools
        run: |
          set -eu
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
          pip install "semgrep==${SEMGREP_VERSION}"
          npm install -g "@fission-ai/openspec@${OPENSPEC_VERSION}"

      # Restore and save separately so the cache is kept even when a gate fails.
      - name: Restore trivy cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/trivy
          key: trivy-${{ github.run_id }}
          restore-keys: trivy-

      - name: Install Ward
        env:
          WARD_INSTALL_DIR: ${{ runner.temp }}/ward/bin
        run: |
          ./install.sh
          echo "$WARD_INSTALL_DIR" >> "$GITHUB_PATH"

      # Pull requests mutate only the domain and application classes they change, or whose test
      # changed; releases mutate everything. The pom.xml profile reads PIT_TARGET_CLASSES.
      - name: Limit mutation testing to changed classes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          targets=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- \
              src/main/java/dev/ward/domain src/main/java/dev/ward/application \
              src/test/java/dev/ward/domain src/test/java/dev/ward/application \
            | grep '\.java$' \
            | sed -E -e 's#^src/(main|test)/java/##' -e 's#(Test)?\.java$#*#' -e 's#/#.#g' \
            | sort -u | paste -sd, - || true)
          echo "Mutation targets: ${targets:-none}"
          echo "PIT_TARGET_CLASSES=${targets:-none.changed}" >> "$GITHUB_ENV"

      # --output keeps the text report on stdout for the job log.
      - name: Run quality gates
        run: ward check --profile ci --format sarif --output target/ward.sarif

      # Fork tokens cannot write security events; no file means Ward could not run at all.
      - name: Upload SARIF to code scanning
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('target/ward.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/ward.sarif
          category: ward

      - name: Save trivy cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/trivy
          key: trivy-${{ github.run_id }}

      - name: Generate coverage report
        if: always()
        run: ./mvnw -B -q jacoco:report

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports
          path: |
            target/site/jacoco/
            target/pit-reports/
            target/ward.sarif
          if-no-files-found: ignore

  native:
    name: Native checks (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.native-runners) }}
    runs-on: ${{ matrix.os }}
    # PowerShell splits -Dname.with.dots=value arguments; Git Bash runs the mvnw script on Windows.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Run terminal tests in a native test image
        run: >-
          ./mvnw -B -Pnative
          -Dtest='dev/ward/infrastructure/terminal/*Test,dev/ward/infrastructure/terminal/**/*Test'
          -Dsurefire.failIfNoSpecifiedTests=false
          test native:test

      - name: Build native executable
        run: ./mvnw -B -q -Pnative -DskipTests package native:compile

      - name: Drive init through a pseudo-terminal
        if: runner.os != 'Windows'
        run: >-
          ./mvnw -B
          -Dtest=NativeInitTerminalSmokeTest
          -Dward.native.binary=target/ward
          test

      - name: Smoke-run the Windows executable
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          target/ward.exe --version
          target/ward.exe --help > /dev/null

      - name: Set up Bun
        if: inputs.harness-compatibility && runner.os != 'Windows'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Verify agent integrations against the native executable
        if: inputs.harness-compatibility && runner.os != 'Windows'
        run: compatibility/run-deterministic.sh target/ward
