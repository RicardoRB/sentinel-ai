name: Verify

# Shared by pull requests and releases. JVM tests cannot see native-image-only failures (for
# example, classes defined at run time), so after the JVM quality gates pass, each runner runs the
# terminal tests inside a native test image, builds the native executable, and drives its raw-key
# init wizard through a pseudo-terminal.
on:
  workflow_call:
    inputs:
      native-runners:
        description: JSON array of POSIX runners for the native checks.
        type: string
        default: '["ubuntu-24.04", "macos-14"]'
      harness-compatibility:
        description: Also run the deterministic agent-harness suites against the native executable.
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    name: Quality gates and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Sentinel
        env:
          SENTINEL_VERSION: v0.0.9
        run: |
          curl -fsSL https://raw.githubusercontent.com/RicardoRB/sentinel-ai/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Sentinel quality gates
        run: sentinel check --profile ci --format json > sentinel-report.json

      - name: Generate Sentinel SARIF report
        if: always()
        run: sentinel check --profile ci --format sarif --output sentinel.sarif

      - name: Upload Sentinel report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-report
          path: |
            sentinel-report.json
            sentinel.sarif
          if-no-files-found: ignore

      - name: Upload Sentinel SARIF to code scanning
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sentinel.sarif
          category: sentinel

  native:
    name: Native checks (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.native-runners) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Run terminal tests in a native test image
        run: >-
          ./mvnw -B -Pnative
          -Dtest='dev/sentinel/infrastructure/terminal/**/*Test'
          -Dsurefire.failIfNoSpecifiedTests=false
          test native:test

      - name: Build native executable
        run: ./mvnw -B -q -Pnative -DskipTests package native:compile

      - name: Drive init through a pseudo-terminal
        run: >-
          ./mvnw -B
          -Dtest=NativeInitTerminalSmokeTest
          -Dsentinel.native.binary=target/sentinel
          test

      - name: Set up Bun
        if: inputs.harness-compatibility
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Verify agent integrations against the native executable
        if: inputs.harness-compatibility
        shell: bash
        run: compatibility/run-deterministic.sh target/sentinel
