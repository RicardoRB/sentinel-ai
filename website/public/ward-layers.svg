<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Ward's four quality layers</title>
  <desc id="desc">Four nested shields around your code. From the inside out: Edit runs the default profile after every agent edit, Commit runs pre-commit, Push runs the stricter pre-push profile, and CI runs every quality and security gate before production.</desc>
  <style>
    .label { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: 0.04em; }
    .code { font: 700 34px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #34d399; }
    .heading { font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f3f4f6; }
    .profile { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a5b4fc; }
    .text { font: 400 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #d1d5db; }
    .muted { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #9ca3af; letter-spacing: 0.06em; }
    .axis { stroke: #6b7280; }
  </style>
  <defs>
    <path id="shield" d="M -100 -110 L 100 -110 L 100 -10 C 100 60 50 100 0 125 C -50 100 -100 60 -100 -10 Z" />
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ca3af" />
    </marker>
  </defs>

  <rect width="880" height="460" rx="20" fill="#0b1220" />

  <g transform="translate(215 226)">
    <use href="#shield" transform="scale(1.8)" fill="#7c3aed" />
    <use href="#shield" transform="scale(1.45)" fill="#4f46e5" />
    <use href="#shield" transform="scale(1.1)" fill="#0284c7" />
    <use href="#shield" transform="scale(0.75)" fill="#059669" />
    <use href="#shield" transform="scale(0.45)" fill="#0b1220" />
    <text class="label" x="0" y="-175" text-anchor="middle">CI</text>
    <text class="label" x="0" y="-136" text-anchor="middle">PUSH</text>
    <text class="label" x="0" y="-98" text-anchor="middle">COMMIT</text>
    <text class="label" x="0" y="-59" text-anchor="middle">EDIT</text>
    <text class="code" x="0" y="14" text-anchor="middle">{ }</text>
  </g>

  <g transform="translate(450 0)">
    <circle cx="10" cy="76" r="8" fill="#059669" />
    <text class="heading" x="30" y="82">1 · Edit</text>
    <text class="profile" x="120" y="82">default</text>
    <text class="text" x="30" y="106">Every agent edit is checked in seconds.</text>

    <circle cx="10" cy="166" r="8" fill="#0284c7" />
    <text class="heading" x="30" y="172">2 · Commit</text>
    <text class="profile" x="142" y="172">pre-commit</text>
    <text class="text" x="30" y="196">The whole project is re-checked before a commit.</text>

    <circle cx="10" cy="256" r="8" fill="#4f46e5" />
    <text class="heading" x="30" y="262">3 · Push</text>
    <text class="profile" x="122" y="262">pre-push</text>
    <text class="text" x="30" y="286">Stricter gates before code leaves your machine.</text>

    <circle cx="10" cy="346" r="8" fill="#7c3aed" />
    <text class="heading" x="30" y="352">4 · CI</text>
    <text class="profile" x="98" y="352">ci</text>
    <text class="text" x="30" y="376">Every quality and security gate before production.</text>

    <line class="axis" x1="10" y1="420" x2="370" y2="420" stroke-width="2" marker-end="url(#arrow)" />
    <text class="muted" x="10" y="446">FASTER</text>
    <text class="muted" x="370" y="446" text-anchor="end">STRICTER</text>
  </g>
</svg>
