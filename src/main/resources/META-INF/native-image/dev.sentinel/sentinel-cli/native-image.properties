# Generated Fory JSON codecs are instantiated by the ForyJson GraalVM Feature at
# image build time and stored in the image heap, so their classes must be
# initialized at build time rather than at run time (the default). The codecs
# are generated into the same package as the @JsonType-annotated DTO holders.
Args=--initialize-at-build-time=dev.sentinel.infrastructure.cli.gate,\
    dev.sentinel.infrastructure.cli.agent,\
    dev.sentinel.infrastructure.learning
# Fory populates the static JsonGeneratedClassRegistry.companionEntries array only
# in its Feature's afterAnalysis (hosted) phase, so points-to analysis sees
# CompanionEntry instances in the image heap without any bytecode instantiation.
# reflect-config.json registers the nested type as reflectively instantiable,
# matching the SDK's documented pattern for types materialized only at build time.